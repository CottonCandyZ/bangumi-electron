[package]
name = "bangumi-velopack-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = { version = "=1.1.1", features = ["public-utils"] }

[profile.release]
lto = "thin"
strip = "symbols"
